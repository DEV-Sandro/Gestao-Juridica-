<div class="login-wrapper fade-in">
  <div class="login-card card-glass">
    
    <div class="brand-header">
      <div class="logo-shield" aria-hidden="true"><img src="assets/brand/justapro-mark.png" alt="" /></div>
      <h1 class="font-heading">JustaPro</h1>
      <p class="brand-tagline">Gestão jurídica do seu escritório</p>
    </div>

    <form (ngSubmit)="acessar()" class="login-form">
      <mat-form-field appearance="outline">
        <mat-label>E-mail Profissional</mat-label>
        <mat-icon matPrefix class="icon-muted">email</mat-icon>
        <input matInput type="email" placeholder="nome@escritorio.com" [(ngModel)]="email" name="email" required>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha de Acesso</mat-label>
        <mat-icon matPrefix class="icon-muted">lock</mat-icon>
        <input matInput [type]="mostrarSenha ? 'text' : 'password'" [(ngModel)]="senha" name="senha" required>
        <button mat-icon-button matSuffix type="button" (click)="mostrarSenha = !mostrarSenha" [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'">
          <mat-icon class="icon-muted">{{ mostrarSenha ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <div class="form-options">
        <mat-checkbox color="primary">Lembrar de mim</mat-checkbox>
        <button type="button" class="forgot-link link-button" (click)="esqueciSenha()">
          Esqueci minha senha
        </button>
      </div>

      <jp-button type="submit" [loading]="carregando" [disabled]="carregando" [block]="true">
        Acessar Workspace
      </jp-button>

      <div class="invite-entry">
        <div class="invite-entry-copy">
          <mat-icon>mark_email_read</mat-icon>
          <span>
            <strong>Recebeu um convite?</strong>
            <small>Ative a conta com o e-mail informado acima.</small>
          </span>
        </div>
        <button type="button" class="invite-entry-action" (click)="continuarConvite()">
          Ativar conta
          <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </form>
    
  </div>
</div>
