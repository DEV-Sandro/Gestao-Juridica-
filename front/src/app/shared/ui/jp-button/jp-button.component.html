<ng-container [ngSwitch]="variant">
  <button
    *ngSwitchCase="'primary'"
    mat-flat-button
    [type]="type"
    [disabled]="isDisabled"
    [attr.aria-label]="ariaLabel"
    [attr.aria-busy]="loading"
    class="jp-base-button jp-btn-primary"
    [class.jp-size-compact]="size === 'compact'">
    <ng-container *ngTemplateOutlet="buttonContent"></ng-container>
  </button>

  <button
    *ngSwitchCase="'danger'"
    mat-flat-button
    [type]="type"
    [disabled]="isDisabled"
    [attr.aria-label]="ariaLabel"
    [attr.aria-busy]="loading"
    class="jp-base-button jp-btn-danger"
    [class.jp-size-compact]="size === 'compact'">
    <ng-container *ngTemplateOutlet="buttonContent"></ng-container>
  </button>

  <button
    *ngSwitchCase="'secondary'"
    mat-stroked-button
    [type]="type"
    [disabled]="isDisabled"
    [attr.aria-label]="ariaLabel"
    [attr.aria-busy]="loading"
    class="jp-base-button jp-btn-secondary"
    [class.jp-size-compact]="size === 'compact'">
    <ng-container *ngTemplateOutlet="buttonContent"></ng-container>
  </button>

  <button
    *ngSwitchDefault
    mat-button
    [type]="type"
    [disabled]="isDisabled"
    [attr.aria-label]="ariaLabel"
    [attr.aria-busy]="loading"
    class="jp-base-button jp-btn-ghost"
    [class.jp-size-compact]="size === 'compact'">
    <ng-container *ngTemplateOutlet="buttonContent"></ng-container>
  </button>
</ng-container>

<ng-template #buttonContent>
  <span class="jp-button-content" [class.jp-button-content-hidden]="loading">
    <ng-content></ng-content>
  </span>
  <mat-spinner *ngIf="loading" class="jp-button-spinner" diameter="20"></mat-spinner>
</ng-template>
